# ============================================================
# Nav2 Full Stack Parameters — ASV KKI 2026
# ============================================================
# Tuned for Autonomous Surface Vehicle (ASV) in open water:
# - Max speed: 0.62 m/s
# - Regulated Pure Pursuit controller (smooth path following)
# - Smac Hybrid-A* planner with forward-only Dubins motion model
# - StaticLayer from survey mapping + LiDAR ObstacleLayer confirmation
# - GPS + EKF localization (map frame = GPS ENU origin)
# ============================================================

# ── BT NAVIGATOR ────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # BT XML paths are supplied by launch. If omitted, Nav2 falls back to its
    # package defaults for NavigateToPose and NavigateThroughPoses.
    # Jazzy loads built-in BT plugins automatically. Do not set plugin_lib_names
    # unless adding a custom BT plugin; otherwise duplicate IDs break startup.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - smoother_error_code

# ── CONTROLLER SERVER ────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: true
    speed_limit_topic: "/asv/speed_limit"
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    odom_topic: /odometry/local

    # Goal checker — generous tolerances for GPS accuracy
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 3.14    # ASV waypoint completion is position-based

    # Progress checker — generous allowance for slow ASV
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 120.0

    # ── Regulated Pure Pursuit controller ──────────────────
    # Best for non-holonomic vehicles (boats, cars) on smooth paths
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.55
      lookahead_dist: 1.5
      min_lookahead_dist: 0.8
      max_lookahead_dist: 2.5
      lookahead_time: 2.0
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.65
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 2.0
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 2.0
      regulated_linear_scaling_min_speed: 0.18
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 15.0

# ── PLANNER SERVER ───────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.30
      downsample_costmap: false
      allow_unknown: true
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      minimum_turning_radius: 1.0
      reverse_penalty: 3.0
      change_penalty: 0.2
      non_straight_penalty: 1.15
      cost_penalty: 2.5
      max_iterations: 500000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smooth_path: true

# ── SMOOTHER SERVER ──────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── BEHAVIOR SERVER ──────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.1
    rotational_acc_lim: 2.0

# ── WAYPOINT FOLLOWER ────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    # WaitAtWaypoint plugin — pause at each waypoint for mission tasks
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0  # Mission supervisor handles timing

# ── VELOCITY SMOOTHER ────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.62, 0.0, 0.95]
    min_velocity: [-0.20, 0.0, -0.85]
    max_accel: [1.25, 0.0, 1.6]
    max_decel: [-1.25, 0.0, -1.6]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false

# ── LOCAL COSTMAP ────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.10
      # ASV footprint (hull approximation in base_link frame)
      footprint: "[[0.50, 0.28], [0.50, -0.28], [-0.50, -0.28], [-0.50, 0.28]]"
      footprint_padding: 0.05
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar_scan
        lidar_scan:
          topic: /asv/lidar/scan
          sensor_frame: asv_kki_2026/lidar_link/lidar_sensor
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.08
          obstacle_max_range: 6.0
          obstacle_min_range: 0.45      # self-filter (same as gps_waypoint_follower)
          raytrace_max_range: 6.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true

      # Simulator-only validation path. Enable together with
      # enable_lidar_pointcloud:=true; real hardware only requires LaserScan.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: false
        observation_sources: lidar_points
        z_resolution: 0.10
        z_voxels: 12
        max_obstacle_height: 1.5
        mark_threshold: 1
        lidar_points:
          topic: /asv/lidar/scan/points
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.45
          raytrace_max_range: 6.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.65

      always_send_full_costmap: true

# ── GLOBAL COSTMAP ───────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      width: 60
      height: 60
      origin_x: -30.0             # Field center at (0,0), field ≈ ±25m
      origin_y: -30.0
      resolution: 0.20
      track_unknown_space: true
      footprint: "[[0.50, 0.28], [0.50, -0.28], [-0.50, -0.28], [-0.50, 0.28]]"
      footprint_padding: 0.05
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      filters: ["preferred_lane_filter", "speed_filter"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /asv/mapping/occupancy
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        track_unknown_space: true

      preferred_lane_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /asv/navigation/keepout_info
        transform_tolerance: 1.5

      # ── Speed Filter — zone-based speed limits from speed_mask.pgm ──
      speed_filter:
        plugin: "nav2_costmap_2d::SpeedFilter"
        enabled: true
        filter_info_topic: /asv/speed_filter_info
        speed_limit_topic: /asv/speed_limit

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar_scan
        lidar_scan:
          topic: /asv/lidar/scan
          sensor_frame: asv_kki_2026/lidar_link/lidar_sensor
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.08
          obstacle_max_range: 6.0
          obstacle_min_range: 0.45
          raytrace_max_range: 6.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: false
        observation_sources: lidar_points
        z_resolution: 0.10
        z_voxels: 12
        max_obstacle_height: 1.5
        mark_threshold: 1
        lidar_points:
          topic: /asv/lidar/scan/points
          data_type: "PointCloud2"
          obstacle_max_range: 6.0
          obstacle_min_range: 0.45
          raytrace_max_range: 6.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.65

      always_send_full_costmap: true

# ── MAP SERVER ───────────────────────────────────────────────
# Nav2 uses /asv/mapping/occupancy as the survey StaticLayer. This map_server
# stanza is left inert so it does not own map->odom or replace the survey map.
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

# ── SPEED FILTER MAP SERVER ───────────────────────────────────
# Publishes the speed mask PGM as an OccupancyGrid for the SpeedFilter plugin.
# The actual yaml path is set dynamically in nav2_stack.launch.py.
speed_mask_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""      # overridden by launch
    topic_name: /asv/speed_mask
    frame_id: map

# ── COSTMAP FILTER INFO SERVER (Speed) ───────────────────────
# Publishes the filter type + coefficients so SpeedFilter knows how to decode
# pixel values from the speed_mask. Formula: speed_limit% = base + mask*multiplier
#   mask=0   → 100% (no limit)    mask=55 → 45% (~0.28 m/s)
#   mask=30  → 70% (~0.43 m/s)   mask=60 → 40% (~0.25 m/s)
speed_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 1              # 1 = percentage of max speed
    base: 100.0          # offset
    multiplier: -1.0     # sign: higher pixel = lower speed
    filter_info_topic: /asv/speed_filter_info
    mask_topic: /asv/speed_mask

# ── LIFECYCLE MANAGER ────────────────────────────────────────
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 30.0
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
