# ============================================================
# Nav2 Collision Monitor — ASV KKI 2026
# ============================================================
# Uses LiDAR scan to create safety zones around the boat.
# Replaces the old custom collision_monitor.py node.
#
# Zone structure (viewed from above, boat facing right →):
#
#  ┌──────────────────────────────────────┐  ← slow_polygon (3.0m front)
#  │   ┌──────────────────────────┐       │  ← approach_polygon (1.8m)
#  │   │   ┌──────────────┐      │       │  ← stop_polygon (0.6m)
#  │   │   │   [BOAT]     │      │       │
#  │   │   └──────────────┘      │       │
#  │   └──────────────────────────┘       │
#  └──────────────────────────────────────┘
#
# Actions:
#   STOP:     obstacle in stop_polygon    → cmd_vel.linear.x = 0
#   SLOWDOWN: obstacle in approach_polygon → speed scaled
#   LIMIT:    obstacle in slow_polygon    → max speed 0.3 m/s
# ============================================================

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0

    # ── Collision polygons ─────────────────────────────────
    polygons: ["stop_polygon", "approach_polygon", "slow_polygon"]

    # STOP zone: 0.8m in front, full width of boat
    # If any obstacle is here → full stop (replaces old reverse logic)
    stop_polygon:
      type: "polygon"
      action_type: "stop"
      min_points: 3
      points: "[[0.80, 0.38], [0.80, -0.38], [-0.20, -0.38], [-0.20, 0.38]]"
      visualize: true
      polygon_pub_topic: "collision_monitor/stop_polygon"
      enabled: true

    # SLOWDOWN zone: 1.8m front — scale speed proportionally
    approach_polygon:
      type: "polygon"
      action_type: "slowdown"
      min_points: 3
      slowdown_ratio: 0.5
      points: "[[1.80, 0.55], [1.80, -0.55], [-0.30, -0.55], [-0.30, 0.55]]"
      visualize: true
      polygon_pub_topic: "collision_monitor/approach_polygon"
      enabled: true

    # LIMIT speed zone: 3.0m front — cap speed at 0.30 m/s
    slow_polygon:
      type: "polygon"
      action_type: "limit"
      min_points: 3
      linear_limit: 0.30
      angular_limit: 0.8
      points: "[[3.00, 0.80], [3.00, -0.80], [-0.40, -0.80], [-0.40, 0.80]]"
      visualize: true
      polygon_pub_topic: "collision_monitor/slow_polygon"
      enabled: true

    # ── Sensor sources ─────────────────────────────────────
    observation_sources: ["lidar_scan"]

    lidar_scan:
      type: "scan"
      topic: "/asv/lidar/scan"
      min_height: -0.5
      max_height: 2.0
      enabled: true
