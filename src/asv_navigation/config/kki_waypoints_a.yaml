origin:
  latitude: 1.470000
  longitude: 102.110000
  elevation: 0.0

default_speed_mps: 0.75

# Semua gate waypoint ditempatkan tepat di TITIK TENGAH antara buoy hijau dan merah.
# Right gates: Green x=13.0, Red x=11.0  → tengah x=12.0
# Left gates:  Green x=-13.0, Red x=-11.0 → tengah x=-12.0
# Top gates:   Green y=13.0, Red y=11.0  → tengah y=12.0
#
# Urutan Course A:
#   Start (10.8,-8.7) → Right Gate 8 (y=0) → Right Gate 9 (y=4.8) → Right Gate 10 (y=8.8)
#   → Top Gate 7 (x=6.2) → Top Gate 6 (x=2.4) → Top Gate 5 (x=-1.4) → Top Gate 4 (x=-5.2)
#   → Left Gate 3 (y=8.8) → Left Gate 2 (y=4.8) → Left Gate 1 (y=0)
#   → Photo zone → Docking

waypoints:
  - {name: start_a, x: 10.80, y: -8.70, speed: 0.22}
  # Pre-approach: naik ke utara sebelum masuk gate pertama
  - {name: pre_gate8, x: 12.00, y: -4.00, speed: 0.30}
  # ─── RIGHT GATE 8 (Green x=13.0, Red x=11.0, y=0.0) ───
  # Titik tengah persis: x=12.0, y=0.0
  - {name: gate8_center, x: 12.00, y: 0.00, speed: 0.35}
  # ─── RIGHT GATE 9 (Green x=13.0, Red x=11.0, y=4.8) ───
  # Titik tengah persis: x=12.0, y=4.8
  - {name: gate9_center, x: 12.00, y: 4.80, speed: 0.35}
  # ─── RIGHT GATE 10 (Green x=13.0, Red x=11.0, y=8.8) ───
  # Titik tengah persis: x=12.0, y=8.8
  - {name: gate10_center, x: 12.00, y: 8.80, speed: 0.28}
  # Corner approach to top gates (clear of corner buoys)
  - {name: corner_top_right, x: 9.00, y: 12.00, speed: 0.22}
  # ─── TOP GATE 7 (Green y=13.0, Red y=11.0, x=6.2) ───
  # Titik tengah persis: x=6.2, y=12.0
  - {name: gate7_center, x: 6.20, y: 12.00, speed: 0.28}
  # ─── TOP GATE 6 (Green y=13.0, Red y=11.0, x=2.4) ───
  # Titik tengah persis: x=2.4, y=12.0
  - {name: gate6_center, x: 2.40, y: 12.00, speed: 0.32}
  # ─── TOP GATE 5 (Green y=13.0, Red y=11.0, x=-1.4) ───
  # Titik tengah persis: x=-1.4, y=12.0
  - {name: gate5_center, x: -1.40, y: 12.00, speed: 0.32}
  # ─── TOP GATE 4 (Green y=13.0, Red y=11.0, x=-5.2) ───
  # Titik tengah persis: x=-5.2, y=12.0
  - {name: gate4_center, x: -5.20, y: 12.00, speed: 0.28}
  # Corner approach to left gates
  - {name: corner_top_left, x: -9.00, y: 12.00, speed: 0.22}
  # ─── LEFT GATE 3 (Green x=-13.0, Red x=-11.0, y=8.8) ───
  # Titik tengah persis: x=-12.0, y=8.8
  - {name: gate3_center, x: -12.00, y: 8.80, speed: 0.28}
  # ─── LEFT GATE 2 (Green x=-13.0, Red x=-11.0, y=4.8) ───
  # Titik tengah persis: x=-12.0, y=4.8
  - {name: gate2_center, x: -12.00, y: 4.80, speed: 0.35}
  # ─── LEFT GATE 1 (Green x=-13.0, Red x=-11.0, y=0.0) ───
  # Titik tengah persis: x=-12.0, y=0.0
  - {name: gate1_center, x: -12.00, y: 0.00, speed: 0.38}
  # Exit left gate zone, head south toward photo targets
  - {name: post_gate1_exit, x: -11.20, y: -3.80, speed: 0.35}
  # ─── SURFACE PHOTO (Target: green box at x=-10.2, y=-5.4) ───
  - {name: surface_photo_approach, x: -8.50, y: -3.80, speed: 0.35}
  - {name: surface_photo_green_box, x: -8.20, y: -5.40, speed: 0.22}

  - {name: surface_photo_retreat, x: -8.20, y: -7.00, speed: 0.35}
  # ─── UNDERWATER PHOTO (Target: blue box at x=-11.0, y=-7.7) ───
  - {name: underwater_photo_approach, x: -8.50, y: -7.50, speed: 0.35}
  - {name: underwater_photo_blue_box, x: -9.00, y: -7.70, speed: 0.22}
  # Exit south to avoid collision with blue box obstacle (-11,-7.7)
  - {name: photo_exit_south, x: -8.00, y: -9.80, speed: 0.40}
  - {name: path_13, x: -12.40, y: -9.80, speed: 0.65}
  - {name: path_14, x: -2.00, y: -11.20, speed: 0.75}
  - {name: path_15, x: 4.00, y: -11.20, speed: 0.75}
  # ─── DOCKING APPROACH (buoys at x=12.35, y=-10.0/-9.7/-9.4) ───
  # Step 1: Go south safely, align at x=11.50
  - {name: return_south, x: 9.00, y: -12.00, speed: 0.60}
  - {name: dock_align_south, x: 11.50, y: -12.00, speed: 0.40}
  # Step 2: Move north alongside the buoy column
  - {name: dock_entry, x: 11.50, y: -11.00, speed: 0.30}
  # Step 3: Position alongside buoy_2 center (y=-9.70)
  - {name: dock_side_align, x: 11.50, y: -9.70, speed: 0.22}
  # Step 4: DOCKING MODE - approach east into the buoys
  - {name: dock_contact_blue_buoys, x: 12.50, y: -9.70, speed: 0.18, docking: true}
